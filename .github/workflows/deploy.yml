name: AstroChitra Newsletter CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even without changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-newsletter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 10m
          envs: FORCE_DEPLOY
          script: cd /var/www/astrochitra-newsletters && git fetch origin && git reset --hard origin/main && bash scripts/deploy.sh
