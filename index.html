<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AstroChitra — Subscribe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: "AstroChitra";
    src: url("assets/AstroChitra.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --ac-olive: #654e12;
    --ac-olive-dark: #4a3a0e;
    --ac-gold: #c9a227;
    --ac-gold-light: #f0d98a;
    --ac-terracotta: #8b4513;
    --ac-accent-green: #5f6b3a;
    --ac-accent-red: #ae172a;
    --ac-accent-red-dark: #7d0f1d;
    --ac-sky: #2f3555;
    --ac-cream: #faf7f2;
    --ac-parchment: #f5efe6;
    --ac-ink: #3a2c10;
    --ac-warm-gray: #8b7d68;

    --font-display: "AstroChitra", "Cormorant Garamond", Georgia, serif;
    --font-body: "Saira", -apple-system, sans-serif;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-card: 0 8px 28px rgba(101, 78, 18, 0.10);
    --shadow-card-hover: 0 16px 40px rgba(101, 78, 18, 0.16);
    --shadow-glow: 0 0 30px rgba(201, 162, 39, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--ac-ink);
    background-color: var(--ac-cream);
    background-image: url("assets/bg-parchment.png");
    background-repeat: repeat-y;
    background-size: 100% auto;
    background-position: top center;
    line-height: 1.55;
  }

  .subscribe-container {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 1.5rem;
  }

  .subscribe-card {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(101,78,18,0.10);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .subscribe-title {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    color: var(--ac-accent-red);
    margin: 0 0 0.5rem;
  }

  .subscribe-subtitle {
    font-size: 1rem;
    color: var(--ac-warm-gray);
    margin: 0 0 2rem;
    max-width: 55ch;
  }

  .form-group { margin-bottom: 1.2rem; text-align: left; }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ac-olive);
    margin-bottom: 0.4rem;
  }

  .form-input {
    width: 100%;
    padding: 0.95rem 1rem;
    font-size: 1rem;
    font-family: var(--font-body);
    border: 1px solid rgba(101,78,18,0.25);
    border-radius: var(--radius-md);
    background: #fff;
    color: var(--ac-ink);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--ac-gold);
    box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
  }

  .btn-subscribe {
    width: 100%;
    padding: 1rem 1.5rem;
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 700;
    color: #3a2c10;
    background: var(--ac-gold);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(201,162,39,0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-subscribe:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(201,162,39,0.45); }
  .btn-subscribe:active { transform: translateY(0); }

  .form-note {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--ac-warm-gray);
  }

  @media (max-width: 480px) {
    .subscribe-card { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>
<div class="subscribe-container">
  <div class="subscribe-card" role="region" aria-label="Newsletter subscription">
    <h1 class="subscribe-title">AstroChitra</h1>
    <p class="subscribe-subtitle">Get monthly wisdom, horoscopes & remedies delivered to your inbox.</p>
    <form id="subscribe-form" action="/api/subscribe.php" method="POST" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" aria-required="true" />
      </div>
      <button type="submit" class="btn-subscribe">Subscribe</button>
      <p class="form-note">No spam. Unsubscribe anytime.</p>
    </form>
  </div>
</div>

<script>
  // Simple client‑side validation + feedback
  const form = document.getElementById('subscribe-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('.btn-subscribe');
    const email = form.email.value.trim();
    if (!email) return;
    btn.disabled = true;
    btn.textContent = 'Subscribing…';
    try {
      const resp = await fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ email })
      });
      if (resp.ok) {
        btn.textContent = 'Subscribed!';
        btn.style.background = 'var(--ac-accent-green)';
        form.reset();
      } else {
        throw new Error('Failed');
      }
    } catch (_) {
      btn.textContent = 'Try again';
      btn.style.background = 'var(--ac-accent-red)';
    }
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = 'Subscribe';
      btn.style.background = '';
    }, 3000);
  });
</script>
</body>
</html>
